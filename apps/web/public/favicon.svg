<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 220 500 500" fill="none">
  <title>Les9</title>
  <defs>
    <symbol id="nine" overflow="visible">
      <circle cx="300" cy="478" r="112" fill="#fff" />
      <rect x="358" y="450" width="78" height="200" rx="16" fill="#fff" />
      <circle cx="300" cy="478" r="50" fill="#000" />
    </symbol>
    <mask id="nine-out" maskUnits="userSpaceOnUse">
      <rect width="640" height="760" fill="#000" />
      <use href="#nine" transform="translate(330 530) scale(1.1) translate(-330 -530)" />
    </mask>
    <mask id="nine-gap" maskUnits="userSpaceOnUse">
      <rect width="640" height="760" fill="#000" />
      <use href="#nine" transform="translate(330 530) scale(1.045) translate(-330 -530)" />
    </mask>
    <mask id="nine-face" maskUnits="userSpaceOnUse">
      <rect width="640" height="760" fill="#000" />
      <use href="#nine" />
    </mask>
  </defs>

  

  <circle cx="320" cy="470" r="214" fill="#fff" stroke="#000" stroke-width="40" />

  <g mask="url(#nine-out)">
    <rect width="640" height="760" fill="#000" />
  </g>
  <g mask="url(#nine-gap)">
    <rect width="640" height="760" fill="#fff" />
  </g>
  <g mask="url(#nine-face)">
    <rect width="640" height="760" fill="#000" />
  </g>
</svg>
